faq:
  - question: "What exactly do you do?"
    answer: >
      We redesign small business websites to be AI-search-optimized. That means structured data,
      FAQ schema, semantic HTML, Open Graph tags, and a local-first chat widget - all for $299
      one-time. You get a single landing page that Google AI Overviews, ChatGPT search, and Perplexity can
      actually read and cite. No hosting lock-in, no subscription required.
    tags: ["what do you do", "services", "what is this", "what do you offer", "do", "explanation", "overview", "what exactly"]
    category: "services"

  - question: "How much does a website redesign cost?"
    answer: >
      $299 one-time. That includes one landing page, up to 6 services with pricing, up to 20 FAQ
      entries with search tags, a local-first chat widget, an AI Search Roadmap PDF, and 1
      revision round. Delivered in 5 business days. 50% deposit to start, 50% on delivery. Full
      refund if you're not satisfied.
    tags: ["price", "cost", "how much", "fees", "pricing", "rate", "rates", "budget", "expensive", "cheap", "affordable", "money"]
    category: "pricing"

  - question: "Why is your price so low compared to other agencies?"
    answer: >
      Because we engineered the process, not just the page. Your business info goes into one structured file, and our tooling generates the page, the schema, and the chat widget from it. Our time goes into your content and the details, not into rebuilding the same plumbing for every client. Agencies charging $3,000+ are mostly billing for hours we automated.
    tags: ["price", "cost", "why so cheap", "why so low", "cheap", "affordable", "low price", "catch", "too good", "inexpensive"]
    category: "pricing"

  - question: "What is AI search optimization?"
    answer: >
      AI search optimization means structuring your website so that AI search engines - Google AI Overviews,
      ChatGPT search, Perplexity, and others - can read it, understand it, and cite it as an
      authoritative source. This includes JSON-LD structured data (FAQ schema, service schema,
      business schema), semantic HTML, Open Graph tags, and clean content that answers real
      questions. It's the 2026 version of SEO, designed for how people actually search now.
    tags: ["ai search", "optimization", "what is ai search", "sgE", "chatgpt search", "perplexity", "ai seo", "search optimization", "structured data", "ai search optimization"]
    category: "services"

  - question: "Do I need to switch hosting providers?"
    answer: >
      No. You own the files - take them and host wherever you want. Vercel, Netlify, GitHub Pages,
      Cloudflare Pages, or any static host. We can recommend a host and help you deploy for free,
      but there's no hosting lock-in. Your site is a set of static files: HTML, CSS, and JavaScript.
      It runs anywhere.
    tags: ["hosting", "switch", "provider", "vercel", "netlify", "github pages", "host", "deploy", "where do i host", "hosting provider", "static host"]
