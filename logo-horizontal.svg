<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120" width="600" height="120">
  <!-- SiteFresh Email Signature Lockup — logo + wordmark -->

  <!-- Logo mark -->
  <g transform="translate(8,8)">
    <rect x="0" y="0" width="104" height="104" rx="24" fill="#0a0b0d"/>
    <polygon points="52,10 88,30 88,74 52,94 16,74 16,30"
             fill="none" stroke="#00d97e" stroke-width="3" stroke-linejoin="round"/>
    <line x1="26" y1="38" x2="78" y2="38" stroke="#00d97e" stroke-width="2.5" opacity="0.4"/>
    <line x1="26" y1="52" x2="78" y2="52" stroke="#00d97e" stroke-width="2.5" opacity="0.7"/>
    <line x1="26" y1="66" x2="78" y2="66" stroke="#00d97e" stroke-width="2.5"/>
    <circle cx="26" cy="52" r="4" fill="#00d97e"/>
  </g>

  <!-- Wordmark -->
  <text x="132" y="56" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif"
        font-size="42" font-weight="800" fill="#0a0b0d" letter-spacing="-0.03em">
    Site<tspan fill="#00d97e">Fresh</tspan>
  </text>
  <text x="132" y="86" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif"
        font-size="14" font-weight="500" fill="#8a8780" letter-spacing="0.02em">
    We engineer websites for AI search
  </text>
</svg>
