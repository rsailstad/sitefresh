<!DOCTYPE html>
<html>
<head>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1920px; height: 1080px; overflow: hidden; }
.bg {
  width: 1920px; height: 1080px;
  background: radial-gradient(ellipse at 50% 60%, #141518 0%, #0a0b0d 60%, #050607 100%);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  position: relative;
}
/* Subtle hexagon pattern */
.bg::before {
  content: "";
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  background-image: 
    repeating-linear-gradient(60deg, transparent 0px, transparent 80px, rgba(0,217,126,0.015) 80px, rgba(0,217,126,0.015) 81px),
    repeating-linear-gradient(-60deg, transparent 0px, transparent 80px, rgba(0,217,126,0.015) 80px, rgba(0,217,126,0.015) 81px),
    repeating-linear-gradient(0deg, transparent 0px, transparent 80px, rgba(0,217,126,0.015) 80px, rgba(0,217,126,0.015) 81px);
  pointer-events: none;
}
/* Green glow orb */
.bg::after {
  content: "";
  position: absolute; bottom: -200px; left: 50%; transform: translateX(-50%);
  width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(0,217,126,0.08) 0%, transparent 70%);
  border-radius: 50%;
  pointer-events: none;
}
.logo-container {
  display: flex; align-items: center; gap: 0;
  margin-bottom: 24px;
  position: relative; z-index: 2;
}
.logo-svg { width: 64px; height: 64px; margin-right: 14px; filter: drop-shadow(0 0 20px rgba(0,217,126,0.3)); }
.brand {
  font-size: 72px; font-weight: 800; letter-spacing: -0.03em; line-height: 1;
}
.brand .site { color: #e8e6e3; }
.brand .fresh { color: #00d97e; }
.tagline {
  font-size: 24px; color: #8a8780; letter-spacing: 0.05em; text-transform: uppercase;
  margin-top: 8px;
  position: relative; z-index: 2;
}
.url {
  font-size: 28px; color: #00d97e; margin-top: 32px; font-weight: 600;
  position: relative; z-index: 2;
  opacity: 0.8;
}
/* Corner accents */
.corner {
  position: absolute; width: 120px; height: 120px;
  border: 2px solid rgba(0,217,126,0.1);
  z-index: 1;
}
.corner.tl { top: 60px; left: 60px; border-right: none; border-bottom: none; }
.corner.tr { top: 60px; right: 60px; border-left: none; border-bottom: none; }
.corner.bl { bottom: 60px; left: 60px; border-right: none; border-top: none; }
.corner.br { bottom: 60px; right: 60px; border-left: none; border-top: none; }
</style>
</head>
<body>
<div class="bg">
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>
  <div class="logo-container">
    <svg class="logo-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <polygon points="50,8 88,30 88,70 50,92 12,70 12,30" fill="none" stroke="#00d97e" stroke-width="3"/>
      <line x1="50" y1="20" x2="50" y2="80" stroke="#00d97e" stroke-width="1.5" opacity="0.6"/>
      <line x1="25" y1="35" x2="75" y2="65" stroke="#00d97e" stroke-width="1.5" opacity="0.4"/>
      <line x1="75" y1="35" x2="25" y2="65" stroke="#00d97e" stroke-width="1.5" opacity="0.4"/>
      <line x1="30" y1="50" x2="70" y2="50" stroke="#00d97e" stroke-width="2"/>
    </svg>
    <div class="brand"><span class="site">Site</span><span class="fresh">Fresh</span></div>
  </div>
  <div class="tagline">We engineer websites for AI search</div>
  <div class="url">sitefresh.co</div>
</div>
</body>
</html>
